name: Deploy SAK100 Full Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sak100-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh \
            -p "$DEPLOY_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'

              set -euo pipefail

              cd /root/sak-platform

              echo "Fetching latest code..."
              git fetch origin main
              git merge --ff-only origin/main

              echo "Installing frontend dependencies..."
              npm ci

              echo "Installing backend dependencies..."
              cd server
              npm ci

              echo "Generating Prisma Client..."
              npx prisma generate

              echo "Building backend..."
              npm run build

              echo "Building frontend..."
              cd ..
              npm run build

              echo "Building backend Docker image..."
              cd server
              docker compose -f docker-compose.backend.yml build backend

              echo "Creating PostgreSQL backup..."
              umask 077
              mkdir -p /root/sak100-db-backups

              BACKUP_FILE="/root/sak100-db-backups/sak100-$(date +%Y%m%d-%H%M%S).dump"

              docker exec sak100-postgres \
                sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
                > "$BACKUP_FILE"

              test -s "$BACKUP_FILE"

              docker exec -i sak100-postgres \
                pg_restore --list < "$BACKUP_FILE" > /dev/null

              echo "Database backup verified: $BACKUP_FILE"

              echo "Applying database migrations..."
              docker compose -f docker-compose.backend.yml run \
                --rm --no-deps backend npx prisma migrate deploy

              echo "Verifying migration status..."
              docker compose -f docker-compose.backend.yml run \
                --rm --no-deps backend npx prisma migrate status

              echo "Recreating backend container..."
              docker compose -f docker-compose.backend.yml up \
                -d --no-deps backend

              cd ..

              echo "Restarting frontend..."
              systemctl restart sak100-frontend.service

              echo "Checking frontend..."
              for attempt in $(seq 1 30); do
                if systemctl is-active --quiet sak100-frontend.service \
                  && curl -fsS http://127.0.0.1:4173/ >/dev/null; then
                  echo "Frontend is ready!"
                  break
                fi

                if [ "$attempt" -eq 30 ]; then
                  echo "Frontend failed to start."
                  systemctl status sak100-frontend.service --no-pager -l
                  journalctl -u sak100-frontend.service -n 50 --no-pager
                  exit 1
                fi

                sleep 2
              done

              echo "Checking backend..."
              for attempt in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
                  echo "Backend is ready!"
                  break
                fi

                if [ "$attempt" -eq 30 ]; then
                  echo "Backend failed to start."
                  docker compose -f server/docker-compose.backend.yml logs --tail=50 backend
                  exit 1
                fi

                sleep 2
              done

              echo "SAK100 deployment completed successfully!"

          REMOTE